name: Publish to PyPI

# Manual dispatch only: no push, pull_request, or release event starts this.
# No PyPI credential is stored anywhere. PyPI authenticates each publish job
# with a short-lived OIDC identity token, so nothing can upload until both
# PyPI projects have a trusted publisher pointing at this repository, this
# workflow file, and the environment named on that project's job below.
# docs/RELEASING.md has the exact fields, the release sequence, and recovery.
#
# Three jobs, in order:
#   build-and-verify   builds both wheels, validates and smoke-tests exactly
#                      those files, and uploads them as one artifact. It has
#                      no OIDC permission.
#   publish-contracts  environment pypi-contracts. Verifies the downloaded
#                      artifact, then uploads openhuntx-webguard-contracts.
#   publish-webguard   environment pypi-webguard. Runs only after
#                      publish-contracts succeeded. Verifies the artifact,
#                      confirms the contracts file on PyPI by name and
#                      SHA-256, then uploads openhuntx-webguard.
# The two publish jobs never rebuild. Each uploads only its own wheel.
#
# The default mode is dry-run: every job runs and every check passes or
# fails exactly as in a real publish, but no upload step runs.
#
# Retrying is safe. A file already on PyPI is treated as done only if its
# filename and SHA-256 match the verified artifact, and any mismatch stops
# the release. Nothing is ever uploaded over an existing file, and
# skip-existing stays off. To retry after a partial failure, use "Re-run
# failed jobs" on the original run, which reuses the same verified artifact.
#
# What actually restricts publishing:
#   - Each environment's deployment-branch policy (repository Settings,
#     Environments) allows only main. GitHub enforces it on the server, so
#     it still holds if someone edits this file on another branch. This is
#     the independent control.
#   - id-token: write exists only on the two publish jobs.
# The typed confirmation and the github.ref condition on the build job stop
# a mistaken dispatch early, but anyone able to edit this file on a branch
# can delete them. Do not count them as protection.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: >-
          dry-run rehearses everything except the uploads. publish uploads
          the two distributions, contracts first.
        type: choice
        options:
          - dry-run
          - publish
        default: dry-run
      confirm:
        description: 'Required for publish mode: type "publish". Ignored by dry-run.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  build-and-verify:
    if: github.ref == 'refs/heads/main'
    name: Build and verify the release artifacts
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.verify.outputs.version }}
      contracts_sha256: ${{ steps.verify.outputs.contracts_sha256 }}
      scanner_sha256: ${{ steps.verify.outputs.scanner_sha256 }}

    steps:
      - name: Require the typed confirmation for publish mode
        env:
          MODE: ${{ github.event.inputs.mode }}
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          if [ "$MODE" != "dry-run" ] && [ "$CONFIRM" != "publish" ]; then
            echo "Mode $MODE needs the confirmation input to be exactly: publish" >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13.14"
          pip-version: "26.2.1"

      - name: Build the two wheels
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          mkdir -p release/dist
          python -m pip wheel packages/contracts/python -w release/dist --no-deps
          python -m pip wheel workers/scanner -w release/dist --no-deps

      - name: Validate, install, and smoke-test exactly those files
        id: verify
        run: |
          python scripts/verify-release-artifacts.py \
            --dist release/dist \
            --checksums-out release/SHA256SUMS \
            --github-output "$GITHUB_OUTPUT"

      - name: Record what would be uploaded
        run: |
          {
            echo "### Release artifacts"
            echo
            echo "Commit: \`${GITHUB_SHA}\`"
            echo
            echo '```'
            cat release/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Hand the verified files to the publish jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: release/
          if-no-files-found: error
          retention-days: 30

  publish-contracts:
    name: Publish openhuntx-webguard-contracts
    needs: build-and-verify
    runs-on: ubuntu-24.04
    environment: pypi-contracts
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out the scripts at the dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the artifacts the build job verified
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: release
          digest-mismatch: error

      - name: Verify the manifest and checksums, and stage only the contracts wheel
        id: stage
        env:
          VERSION: ${{ needs.build-and-verify.outputs.version }}
          CONTRACTS_SHA256: ${{ needs.build-and-verify.outputs.contracts_sha256 }}
          SCANNER_SHA256: ${{ needs.build-and-verify.outputs.scanner_sha256 }}
        run: |
          python3 scripts/release-publish.py stage \
            --release-dir release --distribution contracts --stage-dir stage \
            --expect-version "$VERSION" \
            --expect-contracts-sha256 "$CONTRACTS_SHA256" \
            --expect-webguard-sha256 "$SCANNER_SHA256" \
            --github-output "$GITHUB_OUTPUT"

      - name: Check what PyPI already holds for this project
        id: plan
        env:
          VERSION: ${{ steps.stage.outputs.version }}
          FILENAME: ${{ steps.stage.outputs.filename }}
          SHA256: ${{ steps.stage.outputs.sha256 }}
        run: |
          python3 scripts/release-publish.py plan \
            --project openhuntx-webguard-contracts \
            --version "$VERSION" --filename "$FILENAME" --sha256 "$SHA256" \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload openhuntx-webguard-contracts
        if: github.event.inputs.mode == 'publish' && steps.plan.outputs.state == 'absent'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1, v1.14.2
        with:
          packages-dir: stage/
          skip-existing: false
          attestations: true
          print-hash: true

      - name: Confirm PyPI holds exactly the verified file
        if: github.event.inputs.mode == 'publish'
        env:
          VERSION: ${{ steps.stage.outputs.version }}
          FILENAME: ${{ steps.stage.outputs.filename }}
          SHA256: ${{ steps.stage.outputs.sha256 }}
        run: |
          python3 scripts/release-publish.py await \
            --project openhuntx-webguard-contracts \
            --version "$VERSION" --filename "$FILENAME" --sha256 "$SHA256" \
            --timeout 300

  publish-webguard:
    name: Publish openhuntx-webguard
    needs:
      - build-and-verify
      - publish-contracts
    runs-on: ubuntu-24.04
    environment: pypi-webguard
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out the scripts at the dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the artifacts the build job verified
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: release
          digest-mismatch: error

      - name: Verify the manifest and checksums, and stage only the CLI wheel
        id: stage
        env:
          VERSION: ${{ needs.build-and-verify.outputs.version }}
          CONTRACTS_SHA256: ${{ needs.build-and-verify.outputs.contracts_sha256 }}
          SCANNER_SHA256: ${{ needs.build-and-verify.outputs.scanner_sha256 }}
        run: |
          python3 scripts/release-publish.py stage \
            --release-dir release --distribution webguard --stage-dir stage \
            --expect-version "$VERSION" \
            --expect-contracts-sha256 "$CONTRACTS_SHA256" \
            --expect-webguard-sha256 "$SCANNER_SHA256" \
            --github-output "$GITHUB_OUTPUT"

      - name: Confirm the contracts dependency is on PyPI with the verified hash
        env:
          MODE: ${{ github.event.inputs.mode }}
          VERSION: ${{ steps.stage.outputs.version }}
          FILENAME: ${{ steps.stage.outputs.contracts_filename }}
          SHA256: ${{ steps.stage.outputs.contracts_sha256 }}
        run: |
          set -euo pipefail
          if [ "$MODE" = "publish" ]; then
            python3 scripts/release-publish.py await \
              --project openhuntx-webguard-contracts \
              --version "$VERSION" --filename "$FILENAME" --sha256 "$SHA256" \
              --timeout 300
          else
            python3 scripts/release-publish.py plan \
              --project openhuntx-webguard-contracts \
              --version "$VERSION" --filename "$FILENAME" --sha256 "$SHA256"
          fi

      - name: Check what PyPI already holds for this project
        id: plan
        env:
          VERSION: ${{ steps.stage.outputs.version }}
          FILENAME: ${{ steps.stage.outputs.filename }}
          SHA256: ${{ steps.stage.outputs.sha256 }}
        run: |
          python3 scripts/release-publish.py plan \
            --project openhuntx-webguard \
            --version "$VERSION" --filename "$FILENAME" --sha256 "$SHA256" \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload openhuntx-webguard
        if: github.event.inputs.mode == 'publish' && steps.plan.outputs.state == 'absent'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1, v1.14.2
        with:
          packages-dir: stage/
          skip-existing: false
          attestations: true
          print-hash: true

      - name: Confirm PyPI holds exactly the verified file
        if: github.event.inputs.mode == 'publish'
        env:
          VERSION: ${{ steps.stage.outputs.version }}
          FILENAME: ${{ steps.stage.outputs.filename }}
          SHA256: ${{ steps.stage.outputs.sha256 }}
        run: |
          python3 scripts/release-publish.py await \
            --project openhuntx-webguard \
            --version "$VERSION" --filename "$FILENAME" --sha256 "$SHA256" \
            --timeout 300
